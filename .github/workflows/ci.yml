name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          GEMINI_API: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BLOB_READ_WRITE_TOKEN: ci-placeholder
